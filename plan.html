<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시험까지 가능시간 | 공부도구함</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><nav class="nav"><a class="brand" href="index.html">공부<span>도구함</span> ✦</a><a class="home-link" href="index.html">전체 도구</a></nav></header><main class="wrap"><section class="tool-page"><div class="tool-hero"><span class="eyebrow">공부 계획</span><h1>시험까지 가능시간</h1><p>남은 기간과 하루 공부시간으로 확보 가능한 시간을 계산합니다.</p></div><form class="calculator" data-calculator="plan"><div class="row"><div class="field"><label for="days">남은 일수</label><input id="days" type="number" min="1" step="1" required placeholder="예: 12"></div><div class="field"><label for="hours">하루 공부시간</label><input id="hours" type="number" min="0" max="24" step=".5" required placeholder="예: 3.5"></div></div><button class="primary">공부 가능시간 계산</button><output id="result" class="result" aria-live="polite"></output></form><a class="back" href="index.html">← 전체 도구로 돌아가기</a></section></main><footer class="site-footer">공부도구함 · 필요한 계산을, 더 간단하게</footer><script src="app.js"></script></body></html>
